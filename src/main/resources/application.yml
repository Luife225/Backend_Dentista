spring:
  application:
    name: coronyx-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coronyx}
    username: ${DB_USERNAME:coronyx_app}
    password: ${DB_PASSWORD:1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  local:
    directory: ${CORONYX_STORAGE_PATH:${STORAGE_LOCAL_DIRECTORY:${user.home}/.coronyx/storage}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:${SERVER_PORT:8081}}

jwt:
  secret: ${JWT_SECRET:cambiar-esta-clave-secreta-en-produccion-minimo-256-bits-super-segura}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

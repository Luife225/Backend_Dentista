spring:
  application:
    name: coronyx-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coronyx}
    username: ${DB_USERNAME:akise}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  local:
    directory: ${CORONYX_STORAGE_PATH:${STORAGE_LOCAL_DIRECTORY:${user.home}/.coronyx/storage}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:coronyx-dental-system-secret-key-2026-super-secure-token-jwt-utp-platform}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
